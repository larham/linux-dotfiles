# Font
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0

# Window & Appearance
background_opacity         0.9
background_blur            64
inactive_text_alpha        0.6
confirm_os_window_close    0
remember_window_size       yes
enable_audio_bell          no

# Scrollback & Shell Integration
scrollback_lines           100000
shell_integration          enabled

# Select-to-copy directly to system clipboard
copy_on_select             clipboard

# Layouts (enable splits)
enabled_layouts            splits,stack

# Copy / Paste with Command key
# (Maps both super and ctrl so physical Cmd+C / Cmd+V works on macOS and on Linux with keyd Left Cmd <-> Ctrl swap)
map super+c                copy_or_interrupt
map ctrl+c                 copy_or_interrupt
map super+v                paste_from_clipboard
map ctrl+v                 paste_from_clipboard

# Tabs & Windows
map super+t                new_tab
map ctrl+t                 new_tab
map super+w                close_window
map ctrl+w                 close_window

# Split creation
map super+alt+up           launch --location=hsplit
map super+alt+down         launch --location=hsplit
map super+alt+left         launch --location=vsplit
map super+alt+right        launch --location=vsplit
map ctrl+alt+up            launch --location=hsplit
map ctrl+alt+down          launch --location=hsplit
map ctrl+alt+left          launch --location=vsplit
map ctrl+alt+right         launch --location=vsplit

# Split navigation
map super+up               neighboring_window up
map super+down             neighboring_window down
map super+left             neighboring_window left
map super+right            neighboring_window right
map ctrl+up                neighboring_window up
map ctrl+down              neighboring_window down
map ctrl+left              neighboring_window left
map ctrl+right             neighboring_window right
